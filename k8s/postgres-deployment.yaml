apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: the PVC below is ReadWriteOnce,
  # so a second pod can't mount it while the old one still holds it. A
  # rolling update would start the new pod first and deadlock. With one
  # replica, kill-then-start is the only strategy that works anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: agent-relay-secrets
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              # subPath avoids postgres refusing to start over a non-empty
              # mount root (some volume types pre-populate lost+found/).
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_relay", "-d", "agent_relay"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
