# Local-only credentials, same as compose.yaml's default. Not a real
# secret to protect: this Postgres is never reachable outside the cluster
# network. For anything beyond this homework, generate these and apply
# with `kubectl create secret` instead of committing values in a manifest.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-secrets
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay_dev_only
  POSTGRES_DB: agent_relay
  # Service name "postgres" (below) is the hostname -- Kubernetes gives
  # every Service a cluster-DNS name matching its metadata.name.
  DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay_dev_only@postgres:5432/agent_relay
